services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudy}
      POSTGRES_DB: ${POSTGRES_DB:-cloudy_plag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudy} -d ${POSTGRES_DB:-cloudy_plag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cloudy-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  grobid:
    image: lfoppiano/grobid:0.8.1
    ports:
      - "8070:8070"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx2g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudy}
      POSTGRES_DB: ${POSTGRES_DB:-cloudy_plag}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudy}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cloudy-dev-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-cloudy-plag-documents}
      MINIO_USE_SSL: "false"
      GROBID_URL: http://grobid:8070
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      INTERNAL_API_BASE_URL: http://backend:8000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  minio_data:
