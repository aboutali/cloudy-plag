[project]
name = "cloudy-plag-backend"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "minio>=7.2",
    "httpx>=0.27",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "reportlab>=4.2",
    "readability-lxml>=0.8",
    "lxml>=5.3",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
